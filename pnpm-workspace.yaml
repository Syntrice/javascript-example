packages:
  - javascript-example-backend
  - javascript-example-backend/projects/*
  - javascript-example-frontend

catalogs:
  backend:
  # Dev
    '@eslint/js': ^9.39.1
    '@types/node': ^24.10.1
    eslint: ^9.39.1
    eslint-plugin-unused-imports: ^4.3.0
    globals: ^16.5.0
    jiti: ^2.6.1
    typescript: ^5.9.3
    typescript-eslint: ^8.48.0
    "@types/express": "^5.0.5"
    "@types/swagger-jsdoc": "^6.0.4"
    "@types/swagger-ui-express": "^4.1.8"
  # Not Dev
    "@inversifyjs/http-core": "^4.6.0"
    "@inversifyjs/http-express-v4": "^4.6.0"
    "express": "^5.1.0"
    "inversify": "^7.10.4"
    "reflect-metadata": "^0.2.2"
    "swagger-jsdoc": "^6.2.8"
    "swagger-ui-express": "^5.0.1"


ignoredBuiltDependencies:
